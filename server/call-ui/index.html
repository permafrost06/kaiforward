<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KaiForward · Calls</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<header><a href="http://127.0.0.1:8766">KaiForward</a><span id="connection" class="badge">Connecting</span></header>
<h1>Calls</h1><p class="intro">Answer your Nokia from this computer.</p>
<section class="panel" aria-label="Call controls">
<label for="sim">SIM</label><select id="sim"><option value="1">SIM 1</option><option value="2" selected>SIM 2</option></select>
<div id="call-state" class="call-state" aria-live="polite">Waiting for phone</div>
<div class="actions"><button id="answer" class="primary" disabled>Answer</button><button id="hangup" class="danger" disabled>Hang up</button></div>
<div class="dial"><label for="number">Telephone number</label><div><input id="number" type="tel" autocomplete="off" placeholder="+880…" maxlength="40"><button id="dial" disabled>Call</button></div></div>
</section>
<section class="panel audio"><div><h2>Computer audio</h2><p id="audio-state">Microphone off</p></div><button id="audio">Enable audio</button><div id="audio-level" class="level"><span></span></div></section>
<p id="notice" role="status">Keep the Nokia and this PC connected to the same Wi-Fi.</p>
<footer>Audio is streamed live and is not recorded.</footer>
</main><script src="/app.js" defer></script></body></html>

# dhcpcd already installs the interface route. Gecko normally propagates DNS
# properties; native mode must do so for the existing Bionic/curl resolver.
if [ "$interface" = wlan0 ]; then
    case "$reason" in
        BOUND|INFORM|REBIND|REBOOT|RENEW|TIMEOUT)
            # Android 6 curl resolves through netd. Set a physical default
            # network and its routing table as Gecko used to do.
            prefix=$(kaiforward-native --network-prefix "$new_ip_address" "$new_subnet_mask")
            if [ -n "$prefix" ]; then
                ndc network destroy 100 >/dev/null 2>&1
                ndc network create 100 >/dev/null 2>&1
                ndc network interface add 100 wlan0 >/dev/null 2>&1
                ndc network route add 100 wlan0 "$prefix" >/dev/null 2>&1
                gateway=${new_routers%% *}
                if [ -n "$gateway" ]; then
                    ndc network route add 100 wlan0 0.0.0.0/0 "$gateway" >/dev/null 2>&1
                fi
                ndc resolver setnetdns 100 "$new_domain_name" $new_domain_name_servers >/dev/null 2>&1
                ndc network default set 100 >/dev/null 2>&1
            fi
            count=1
            for dnsaddr in $new_domain_name_servers; do
                [ "$count" -le 4 ] || break
                setprop net.dns$count "$dnsaddr"
                count=$((count + 1))
            done
            while [ "$count" -le 4 ]; do
                setprop net.dns$count ""
                count=$((count + 1))
            done
            ;;
        EXPIRE|FAIL|IPV4LL|RELEASE|STOP)
            ndc network destroy 100 >/dev/null 2>&1
            for count in 1 2 3 4; do setprop net.dns$count ""; done
            ;;
    esac
fi
